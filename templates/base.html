<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}闸机行程整理{% endblock %}</title>
  <style>
    :root { --line:#e2e5ea; --ink:#1f2733; --muted:#6b7686; --accent:#0b5fff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
           color:var(--ink); background:#f6f7f9; }
    header { background:#16233a; color:#fff; padding:14px 24px; }
    header a { color:#fff; text-decoration:none; font-weight:600; font-size:17px; }
    main { max-width:1080px; margin:24px auto; padding:0 16px 48px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px;
            padding:18px 20px; margin-bottom:20px; }
    h1 { font-size:20px; margin:0 0 4px; }
    h2 { font-size:16px; margin:0 0 12px; }
    .muted { color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:12.5px; white-space:nowrap; }
    tr:last-child td { border-bottom:none; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
    .flash.success { background:#e7f6ec; color:#146c2e; border:1px solid #bfe6cb; }
    .flash.error   { background:#fdecea; color:#a12622; border:1px solid #f5c6c2; }
    .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
    .tag.ok   { background:#e7f6ec; color:#146c2e; }
    .tag.bad  { background:#fdecea; color:#a12622; }
    .tag.warn { background:#fff4e0; color:#8a5a00; }
    input[type=file] { font-size:14px; }
    button { background:var(--accent); color:#fff; border:none; border-radius:8px;
             padding:9px 18px; font-size:14px; cursor:pointer; }
    button:hover { opacity:.9; }
    a.cardlink { color:var(--accent); text-decoration:none; font-weight:600; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
  </style>
</head>
<body>
<header><a href="{{ url_for('index') }}">🚇 闸机离线补传 · 行程整理</a></header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
